<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spanish A2+ Trainer</title>


    
<style>
body{
    font-family: Arial, sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
    background:#f4f4f4;
}
h1{
    color:#333;
}
.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:15px;
}
button{
    padding:10px 15px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:5px;
}
.primary{
    background:#0078d4;
    color:white;
}
.success{
    background:#107c10;
    color:white;
}
input{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:10px;
}
.correct{
    color:green;
    font-weight:bold;
}
.wrong{
    color:red;
    font-weight:bold;
}
.stats{
    display:flex;
    gap:20px;
}
</style>
</head>

<body>

<h1>Spanish A2+ Trainer</h1>

<div class="stats">
<div>✅ Correct: <span id="correctCount">0</span></div>
<div>❌ Wrong: <span id="wrongCount">0</span></div>
</div>

<div class="card">

<select id="mode">
<option value="vocab">Vocabulary</option>
<option value="phrases">Phrases</option>
<option value="tenses">Tenses</option>
</select>

<h2 id="question"></h2>

<button class="primary" onclick="showAnswer()">Show Answer</button>

<div id="answerSection" style="display:none;margin-top:15px;">

    <h3 id="revealedAnswer"></h3>

    <p>Did you get it?</p>

    <button class="success" onclick="markCorrect()">
        ✅ Got It
    </button>

    <button style="background:#d13438;color:white;"
            onclick="markWrong()">
        ❌ Didn't Get It
    </button>

</div>

<button onclick="nextQuestion()">Skip</button>

<p id="feedback"></p>

</div>

<script>
let wordStats =
JSON.parse(localStorage.getItem("wordStats")) || {};
    
const vocabulary = [
{id:1,q:"receipt",a:"recibo"},
{id:2,q:"neighbourhood",a:"barrio"},
{id:3,q:"maintenance",a:"mantenimiento"},
{id:4,q:"although",a:"aunque"},
{id:5,q:"electrician",a:"electricista"},
{id:6,q:"plumber",a:"fontanero"},
{id:7,q:"mortgage",a:"hipoteca"},
{id:8,q:"appointment",a:"cita"},
{id:9,q:"invoice",a:"factura"},
{id:10,q:"transfer",a:"transferencia"}
];


const phrases = [
{q:"I need an appointment",a:"necesito una cita"},
{q:"The plumber is coming tomorrow",a:"el fontanero viene mañana"},
{q:"The heating is not working",a:"la calefacción no funciona"},
{q:"Can I have the bill please",a:"la cuenta por favor"},
{q:"I already sent the documents",a:"ya envié los documentos"}
];

const tenses = [
{q:"Yesterday I bought bread",a:"ayer compré pan"},
{q:"Yesterday I called the electrician",a:"ayer llamé al electricista"},
{q:"Tomorrow I will call the plumber",a:"mañana llamaré al fontanero"},
{q:"Next year we will move to Spain",a:"el año que viene nos mudaremos a españa"},
{q:"The builder will start next week",a:"el constructor empezará la semana que viene"}
];

let currentQuestion;
let correct=Number(localStorage.getItem("correct"))||0;
let wrong=Number(localStorage.getItem("wrong"))||0;

document.getElementById("correctCount").textContent=correct;
document.getElementById("wrongCount").textContent=wrong;

function getDataset(){
    const mode=document.getElementById("mode").value;
    if(mode==="vocab") return vocabulary;
    if(mode==="phrases") return phrases;
    return tenses;
}

function nextQuestion(){
    const dataset=getDataset();
    if(document.getElementById("mode").value==="vocab"){
    currentQuestion =
        chooseWeightedWord(dataset);
}else{
    currentQuestion =
        dataset[Math.floor(Math.random()*dataset.length)];
}

    document.getElementById("question").textContent=currentQuestion.q;
    document.getElementById("feedback").textContent="";
    document.getElementById("answerSection").style.display = "none";
}

function showAnswer(){

    document.getElementById("revealedAnswer").textContent =
        currentQuestion.a;

    document.getElementById("answerSection").style.display =
        "block";
}

function markCorrect(){
if(currentQuestion.id){

    if(!wordStats[currentQuestion.id]){
        wordStats[currentQuestion.id] = {
            correct:0,
            wrong:0
        };
    }

    wordStats[currentQuestion.id].correct++;

    localStorage.setItem(
        "wordStats",
        JSON.stringify(wordStats)
    );
}
    correct++;

    localStorage.setItem("correct",correct);

    document.getElementById("correctCount").textContent =
        correct;

    document.getElementById("feedback").innerHTML =
        "<span class='correct'>Great!</span>";

    setTimeout(nextQuestion,800);
}
function getWordWeight(word){

    const stats = wordStats[word.id];

    if(!stats){
        return 5;
    }

    return 1 + stats.wrong * 3 - stats.correct;
}
function chooseWeightedWord(dataset){

    const weightedPool = [];

    dataset.forEach(word => {

        const weight =
            Math.max(1,getWordWeight(word));

        for(let i=0;i<weight;i++){
            weightedPool.push(word);
        }

    });

    return weightedPool[
        Math.floor(
            Math.random()*weightedPool.length
        )
    ];
}    
function markWrong(){
if(currentQuestion.id){

    if(!wordStats[currentQuestion.id]){
        wordStats[currentQuestion.id] = {
            correct:0,
            wrong:0
        };
    }

    wordStats[currentQuestion.id].wrong++;

    localStorage.setItem(
        "wordStats",
        JSON.stringify(wordStats)
    );
}
    wrong++;

    localStorage.setItem("wrong",wrong);

    document.getElementById("wrongCount").textContent =
        wrong;

    document.getElementById("feedback").innerHTML =
        "<span class='wrong'>We'll review this again.</span>";

    setTimeout(nextQuestion,800);
}
    
document.getElementById("mode")
.addEventListener("change",nextQuestion);

nextQuestion();

</script>

</body>
</html>
