<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Spanish A2+ Trainer</title>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
    background:#f4f4f4;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.primary{
    background:#0078d4;
    color:white;
}

.success{
    background:#107c10;
    color:white;
}

.danger{
    background:#d13438;
    color:white;
}

.secondary{
    background:#666;
    color:white;
}

.stats{
    display:flex;
    gap:20px;
    margin-bottom:15px;
}

#question{
    min-height:60px;
}

#debug{
    margin:10px 0;
    color:#666;
    font-size:14px;
}

.mode-options{
    margin:10px 0 20px 0;
}

</style>
</head>

<body>

<h1>🇪🇸 Spanish A2+ Trainer</h1>

<div class="stats">
    <div>✅ Correct: <span id="correctCount">0</span></div>
    <div>❌ Wrong: <span id="wrongCount">0</span></div>
</div>

<div id="debug"></div>

<div class="card">

<select id="mode">
    <option value="vocab">Vocabulary</option>
    <option value="phrases">Phrases</option>
    <option value="tenses">Tenses</option>
</select>

<div class="mode-options">
    <label>
        <input type="checkbox" id="reverseMode">
        Reverse Mode (Spanish → English)
    </label>
    
    <label>
        <input type="checkbox" id="weakMode">
        Weak Words Only
    </label>
</div>

<h2 id="question"></h2>

<button
    class="primary"
    onclick="showAnswer()">
    Show Answer
</button>

<div
    id="answerSection"
    style="display:none">

    <h3 id="revealedAnswer"></h3>

    <p>Did you get it?</p>

    <button
        class="success"
        onclick="markCorrect()">
        ✅ Got It
    </button>

    <button
        class="danger"
        onclick="markWrong()">
        ❌ Didn't Get It
    </button>

</div>

<div>

    <button
        class="secondary"
        onclick="nextQuestion()">
        Skip
    </button>

    <button
        class="secondary"
        onclick="resetLearning()">
        Reset Learning
    </button>

</div>

</div>

<script src="vocabulary.js"></script>
<script src="phrases.js"></script>
<script src="tenses.js"></script>

<script>

let wordStats =
JSON.parse(
    localStorage.getItem("wordStats")
) || {};

let lastQuestionId = null;

let correct =
Number(localStorage.getItem("correct")) || 0;

let wrong =
Number(localStorage.getItem("wrong")) || 0;

let currentQuestion;

document.getElementById("correctCount").textContent =
    correct;

document.getElementById("wrongCount").textContent =
    wrong;

function getDataset(){

    const mode =
        document.getElementById("mode").value;

    if(mode === "vocab") return vocabulary;
    if(mode === "phrases") return phrases;

    return tenses;
}

function getWordWeight(word){

    const stats =
        wordStats[word.id];

    if(!stats){
        return 10;
    }

    return Math.max(
        2,
        10 + stats.wrong * 4 - stats.correct
    );
}

function chooseWeightedWord(dataset){

    const pool = [];

    dataset.forEach(word => {

        const weight =
            getWordWeight(word);

        for(let i=0;i<weight;i++){
            pool.push(word);
        }

    });

    let selected;

    do{

        selected =
            pool[
                Math.floor(
                    Math.random() *
                    pool.length
                )
            ];

    } while (
        selected.id === lastQuestionId &&
        pool.length > 1
    );

    lastQuestionId = selected.id;

    return selected;
}

function nextQuestion(){

    const dataset =
        getDataset();

    if(
        document.getElementById("mode").value ===
        "vocab"
    ){

        currentQuestion =
            chooseWeightedWord(dataset);

    }else{

        currentQuestion =
            dataset[
                Math.floor(
                    Math.random() *
                    dataset.length
                )
            ];
    }

    const reverseMode =
        document.getElementById("reverseMode").checked;

    if(
        reverseMode &&
        document.getElementById("mode").value ===
        "vocab"
    ){

        document.getElementById("question")
            .textContent =
            currentQuestion.a;

    }else{

        document.getElementById("question")
            .textContent =
            currentQuestion.q;
    }

    document.getElementById("answerSection")
        .style.display = "none";

    document.getElementById("debug")
        .textContent = "";
}

function showAnswer(){

    const reverseMode =
        document.getElementById("reverseMode").checked;

    if(
        reverseMode &&
        document.getElementById("mode").value ===
        "vocab"
    ){

        document.getElementById("revealedAnswer")
            .textContent =
            currentQuestion.q;

    }else{

        document.getElementById("revealedAnswer")
            .textContent =
            currentQuestion.a;
    }

    document.getElementById("answerSection")
        .style.display = "block";

    updateDebug();
}

function updateWordStats(type){

    if(!currentQuestion.id){
        return;
    }

    if(!wordStats[currentQuestion.id]){

        wordStats[currentQuestion.id] = {
            correct:0,
            wrong:0
        };
    }

    wordStats[currentQuestion.id][type]++;

    localStorage.setItem(
        "wordStats",
        JSON.stringify(wordStats)
    );
}

function markCorrect(){

    updateWordStats("correct");

    correct++;

    localStorage.setItem(
        "correct",
        correct
    );

    document.getElementById("correctCount")
        .textContent =
        correct;

    setTimeout(
        nextQuestion,
        1500
    );
}

function markWrong(){

    updateWordStats("wrong");

    wrong++;

    localStorage.setItem(
        "wrong",
        wrong
    );

    document.getElementById("wrongCount")
        .textContent =
        wrong;

    setTimeout(
        nextQuestion,
        1500
    );
}

function updateDebug(){

    if(
        !currentQuestion ||
        !currentQuestion.id
    ){
        return;
    }

    const stats =
        wordStats[currentQuestion.id];

    if(!stats){

        document.getElementById("debug")
            .textContent =
            "New Word";

        return;
    }

    document.getElementById("debug")
        .textContent =
        `Correct: ${stats.correct} | Wrong: ${stats.wrong}`;
}

function resetLearning(){

    if(
        confirm(
            "Reset all learning history?"
        )
    ){

        localStorage.clear();

        location.reload();
    }
}

document
    .getElementById("mode")
    .addEventListener(
        "change",
        nextQuestion
    );

nextQuestion();

</script>

</body>
</html>
